name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinical_web_app-main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clinical_web_app-main/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend (lint + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-patient-management-backend-main
    env:
      # src/models/db.js throws at import time if this is unset, and several
      # unit tests (e.g. refreshTokens.test.js, scope.test.js) transitively
      # import it just for the `pool` export they never actually call in
      # this job (no Postgres service here — that's the separate
      # `migrations` job below). A placeholder satisfies the presence check
      # without needing a real database; `pg`'s Pool doesn't connect until
      # first query.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: new-patient-management-backend-main/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (syntax check)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Security audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

  migrations:
    name: Migrations (fresh build + idempotency)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-patient-management-backend-main
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pmtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pmtest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: new-patient-management-backend-main/package-lock.json

      - name: Install
        run: npm ci

      - name: Apply migrations to an empty database
        run: npm run migrate

      - name: Re-run — migrations must be idempotent (no pending, no error)
        run: npm run migrate

      - name: Seed must apply against the migrated schema
        run: npm run seed

      - name: Integration tests (isolation + auth flow)
        run: npx vitest run int.test
        env:
          INTEGRATION_DB_URL: postgresql://postgres:postgres@localhost:5432/pmtest
          JWT_SECRET: ci_only_secret_min_32_chars_xxxxxxxxxxxx
